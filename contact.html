<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดต่อ - ชัชชนันท์ จัดการ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header>
    <span class="site-name">My Page v2</span>
    <nav>
      <a href="index.html">หน้าหลัก</a>
      <a class="here" href="contact.html">ติดต่อ</a>
    </nav>
  </header>

  <main>
    <h1>ติดต่อ</h1>
    <p>กรอกข้อมูลด้านล่างเพื่อส่งข้อความถึงฉัน</p>

    
    <form action="#" method="post">
      <div class="field">
        <label for="name">ชื่อ</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="topic">เรื่องที่ติดต่อ</label>
        <select id="topic" name="topic">
          <option>สอบถามทั่วไป</option>
          <option>งานหรือโปรเจกต์</option>
          <option>อื่น ๆ</option>
        </select>
      </div>

      <div class="field">
        <label for="message">ข้อความ</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit">ส่งข้อความ</button>
    </form>

    <p class="contact-cta"><a href="index.html">กลับหน้าหลัก</a></p>
  </main>

  <footer>

    <a href="https://github.com/chadchanan-j">GitHub</a>
    <a href="index.html">หน้าหลัก</a>
    <br>
    ชัชชนันท์ จัดการ - Homework #3 Full Stack Web Development
  </footer>

</div>
</body>
</html>
